name: minha_ia
description: "MINHA IA — Sua imaginação, sem limites."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^16.0.0
  flutter_riverpod: ^2.6.1
  cached_network_image: ^3.3.1
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.6
  dio: ^5.7.0
  material_ui: ^1.11.1
  cupertino_icons: ^1.0.8

  # Cliente Dart gerado a partir de backend/openapi.yaml (não editar à mão).
  built_value: ^8.4.0
  built_collection: ^5.1.1
  one_of: ^1.5.0
  one_of_serializer: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  built_value_generator: ^8.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/
