include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    prefer_const_constructors: warning
    avoid_print: warning
  exclude:
    - build/**
    - android/**
    - ios/**
    # Cliente Dart gerado por openapi-generator: é sobrescrito a cada
    # regeneração do contrato, portanto não deve ser editado para satisfazer lints.
    - lib/services/api/generated/**

linter:
  rules:
    always_declare_return_types: true
    sort_child_properties_last: true
    use_super_parameters: true
