name: minha-ia

# F0 — overlay de produção. Uso:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Todos os segredos abaixo são OBRIGATÓRIOS: o compose falha antes de subir se
# algum estiver ausente, e o backend valida novamente na inicialização.

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}

  api:
    environment:
      APP_ENV: production
      AUTH_PROVIDER: firebase
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Defina FIREBASE_PROJECT_ID no .env}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:?Defina FIREBASE_SERVICE_ACCOUNT_JSON no .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Defina OPENAI_API_KEY no .env}
      FAL_API_KEY: ${FAL_API_KEY:?Defina FAL_API_KEY no .env}
      FAL_WEBHOOK_USER_ID: ${FAL_WEBHOOK_USER_ID:?Defina FAL_WEBHOOK_USER_ID no .env}
      ALLOW_MOCK_PROVIDERS: "false"
      CREDITS_ENFORCED: "true"

  worker:
    environment:
      APP_ENV: production
      AUTH_PROVIDER: firebase
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Defina FIREBASE_PROJECT_ID no .env}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:?Defina FIREBASE_SERVICE_ACCOUNT_JSON no .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Defina OPENAI_API_KEY no .env}
      FAL_API_KEY: ${FAL_API_KEY:?Defina FAL_API_KEY no .env}
      FAL_WEBHOOK_USER_ID: ${FAL_WEBHOOK_USER_ID:?Defina FAL_WEBHOOK_USER_ID no .env}
      ALLOW_MOCK_PROVIDERS: "false"
      CREDITS_ENFORCED: "true"

  beat:
    environment:
      APP_ENV: production
      AUTH_PROVIDER: firebase
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Defina FIREBASE_PROJECT_ID no .env}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:?Defina FIREBASE_SERVICE_ACCOUNT_JSON no .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Defina OPENAI_API_KEY no .env}
      FAL_API_KEY: ${FAL_API_KEY:?Defina FAL_API_KEY no .env}
      FAL_WEBHOOK_USER_ID: ${FAL_WEBHOOK_USER_ID:?Defina FAL_WEBHOOK_USER_ID no .env}
      ALLOW_MOCK_PROVIDERS: "false"
      CREDITS_ENFORCED: "true"
